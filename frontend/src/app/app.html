<div class="flex min-h-screen flex-col bg-slate-50">
  <header class="bg-slate-900 text-white shadow">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-2 px-4 py-3">
      <a routerLink="/" class="truncate text-base font-semibold" data-testid="shell-brand">
        {{ appName }}
      </a>

      @if (!hasSession()) {
      <a
        routerLink="/invitacion"
        class="rounded px-2 py-1 text-sm hover:bg-slate-700"
        data-testid="shell-invite-link"
      >
        Entrar con un enlace
      </a>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-6" [class.pb-28]="showNavigation()">
    <router-outlet />
  </main>

  @if (showNavigation()) {
  <nav
    class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)]"
    aria-label="Navegación principal"
    data-testid="shell-nav"
  >
    <ul class="mx-auto flex max-w-3xl">
      @for (item of items; track item.testId) {
      <li class="flex flex-1">
        @if (item.photo) {
        <button
          type="button"
          class="flex w-full flex-col items-center gap-0.5 px-2 py-1"
          aria-label="Tomar una foto"
          [attr.data-testid]="item.testId"
          (click)="openCamera(cameraInput)"
        >
          <span
            aria-hidden="true"
            class="flex h-12 w-12 items-center justify-center rounded-full bg-slate-900 text-lg text-white shadow-lg"
          >
            {{ item.icon }}
          </span>
          <span class="text-xs font-semibold text-slate-900">{{ item.label }}</span>
        </button>
        } @else if (item.help) {
        <div
          aria-hidden="true"
          class="flex w-full flex-col items-center gap-0.5 px-2 py-2 text-xs text-slate-400"
          [attr.data-testid]="item.testId"
        >
          <span class="text-base leading-none">?</span>
          <span>{{ item.label }}</span>
        </div>
        } @else {
        <a
          [routerLink]="item.path"
          class="flex w-full flex-col items-center gap-0.5 px-2 py-2 text-xs"
          [class.text-slate-900]="item.section !== null && item.section === activeSection()"
          [class.font-semibold]="item.section !== null && item.section === activeSection()"
          [class.text-slate-500]="item.section === null || item.section !== activeSection()"
          [attr.aria-current]="
            item.section !== null && item.section === activeSection() ? 'page' : null
          "
          [attr.data-testid]="item.testId"
        >
          <span aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
        }
      </li>
      }
    </ul>

    <input
      #cameraInput
      type="file"
      data-testid="shell-photo-input"
      [attr.accept]="cameraAccept"
      capture="environment"
      tabindex="-1"
      aria-hidden="true"
      class="sr-only"
      (change)="onCameraFile($event)"
    />
  </nav>
  }
</div>

<button
  [type]="type()"
  [disabled]="isDisabled()"
  [class]="classes()"
  [attr.data-testid]="testId()"
  [attr.data-state]="state()"
  [attr.aria-busy]="working()"
  [attr.aria-label]="label()"
>
  <span
    aria-hidden="true"
    data-testid="progress-button-fill"
    class="absolute inset-y-0 left-0 bg-[var(--color-brand)] motion-safe:transition-[width] motion-safe:duration-150"
    [style.width.%]="working() ? percent() : 0"
    [style.opacity]="fillOpacity()"
  ></span>
  <span class="relative">{{ text() }}</span>
</button>
<span role="status" aria-live="polite" data-testid="progress-button-status" class="sr-only"
  >{{ milestone() === 0 ? '' : milestone() + '%' }}</span
>

<app-ui-card title="Canjear invitación">
  <p class="text-sm text-slate-600">
    Pega el enlace o el token que te compartió el administrador. El canje abre la sesión de este
    dispositivo y no necesitas cuenta.
  </p>

  <label class="mt-4 block text-sm font-medium text-slate-800" for="invite-token">
    Enlace o token
  </label>
  <input
    id="invite-token"
    data-testid="redeem-token"
    type="text"
    autocomplete="off"
    spellcheck="false"
    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
    [value]="token()"
    (input)="onTokenInput($event)"
  />

  <div class="mt-4 flex flex-wrap items-center gap-3">
    <button
      type="button"
      [class]="primaryClasses"
      data-testid="redeem-submit"
      [disabled]="submitting()"
      (click)="redeem()"
    >
      {{ submitting() ? 'Canjeando…' : 'Canjear' }}
    </button>

    <a routerLink="/" class="text-sm text-slate-600 underline" data-testid="redeem-home-link">
      Volver al inicio
    </a>
  </div>

  @if (error(); as message) {
    <p class="mt-3 text-sm text-red-600" data-testid="redeem-error">{{ message }}</p>
  }
</app-ui-card>

@if (visible()) {
  <div class="space-y-1" data-testid="shell-account-link-card">
    <p class="text-xs text-slate-500">
      Vincular una cuenta te deja volver a este evento desde otro dispositivo sin un enlace nuevo.
    </p>

    <button
      type="button"
      class="w-full rounded px-2 py-1 text-left text-sm text-slate-700 hover:bg-slate-100 disabled:opacity-60"
      data-testid="shell-account-link"
      [disabled]="connecting()"
      (click)="link()"
    >
      {{ connecting() ? 'Abriendo el proveedor…' : 'Vincular cuenta' }}
    </button>

    @if (error(); as message) {
      <p class="text-xs text-red-600" data-testid="shell-account-link-error">{{ message }}</p>
    }
  </div>
}

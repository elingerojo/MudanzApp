<section class="space-y-3">
  @if (failed()) {
    <p class="rounded-lg bg-red-50 p-3 text-sm text-red-700" data-testid="oauth-callback-error">
      {{ error() }}
    </p>

    <a routerLink="/" class="text-sm text-slate-600 underline" data-testid="oauth-callback-home">
      Volver al inicio
    </a>
  } @else {
    <p class="text-sm text-slate-600" data-testid="oauth-callback-working">Vinculando la cuenta…</p>
  }
</section>

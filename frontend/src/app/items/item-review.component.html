<form class="space-y-3" (submit)="save($event)" data-testid="item-review-form">
  <div class="rounded-lg bg-slate-50 p-3">
    <p class="text-xs font-medium text-slate-500">Ficha guardada</p>
    <p class="text-sm text-slate-900" data-testid="item-review-current-title">{{ item().title }}</p>
    @if (item().note; as note) {
      <p class="text-xs text-slate-600" data-testid="item-review-current-note">{{ note }}</p>
    }
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      [class]="secondaryClasses"
      [disabled]="busy()"
      (click)="draft()"
      data-testid="item-review-draft"
    >
      {{ drafting() ? 'Pidiendo el borrador…' : 'Borrador con IA' }}
    </button>
  </div>

  @if (notice(); as text) {
    <p class="rounded-lg bg-sky-50 p-2 text-xs text-sky-800" data-testid="item-review-draft-notice">
      {{ text }}
    </p>
  }

  <div>
    <label class="block text-sm font-medium text-slate-800" for="item-review-title">Título</label>
    <input
      id="item-review-title"
      data-testid="item-review-title"
      type="text"
      autocomplete="off"
      maxlength="120"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      [value]="title()"
      (input)="onTitle($event)"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="item-review-note">Nota</label>
    <textarea
      id="item-review-note"
      data-testid="item-review-note"
      rows="2"
      maxlength="500"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      [value]="note()"
      (input)="onNote($event)"
    ></textarea>
  </div>

  @if (error(); as text) {
    <p class="text-xs text-red-600" data-testid="item-review-error">{{ text }}</p>
  }

  <div class="flex flex-wrap gap-2">
    <button
      type="submit"
      [class]="primaryClasses"
      [disabled]="!canSave()"
      data-testid="item-review-save"
    >
      {{ saving() ? 'Guardando…' : 'Guardar ficha' }}
    </button>

    <button
      type="button"
      [class]="secondaryClasses"
      [disabled]="busy()"
      (click)="closed.emit()"
      data-testid="item-review-cancel"
    >
      Cancelar
    </button>
  </div>
</form>

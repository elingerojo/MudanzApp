<form class="space-y-4" (submit)="submit($event)">
  <div>
    <span class="block text-sm font-medium text-slate-800">Foto</span>

    <input
      id="item-photo"
      data-testid="item-photo-input"
      type="file"
      [attr.accept]="accept"
      capture="environment"
      class="sr-only"
      (change)="onPhoto($event)"
    />

    <label for="item-photo" [class]="secondaryClasses" data-testid="item-photo-label" class="mt-1">
      {{ photo() === null ? 'Tomar o elegir una foto' : 'Cambiar la foto' }}
    </label>

    @if (preview(); as src) {
      <img
        [src]="src"
        alt="Vista previa de la foto del artículo"
        class="mt-3 h-40 w-full rounded-lg object-cover"
        data-testid="item-photo-preview"
      />
    }
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="item-title">Título</label>
    <input
      id="item-title"
      data-testid="item-title-input"
      type="text"
      autocomplete="off"
      maxlength="120"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      [value]="title()"
      (input)="onInput('title')($event)"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="item-note">Nota</label>
    <textarea
      id="item-note"
      data-testid="item-note-input"
      rows="2"
      maxlength="500"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      [value]="note()"
      (input)="onInput('note')($event)"
    ></textarea>
  </div>

  <fieldset class="grid grid-cols-2 gap-3 sm:grid-cols-4">
    <legend class="mb-1 text-sm font-medium text-slate-800">Medidas (opcional)</legend>

    <div>
      <label class="block text-xs text-slate-600" for="item-width">Ancho (cm)</label>
      <input
        id="item-width"
        data-testid="item-width-input"
        type="number"
        min="1"
        inputmode="numeric"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
        [value]="widthCm()"
        (input)="onInput('widthCm')($event)"
      />
    </div>

    <div>
      <label class="block text-xs text-slate-600" for="item-height">Alto (cm)</label>
      <input
        id="item-height"
        data-testid="item-height-input"
        type="number"
        min="1"
        inputmode="numeric"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
        [value]="heightCm()"
        (input)="onInput('heightCm')($event)"
      />
    </div>

    <div>
      <label class="block text-xs text-slate-600" for="item-depth">Fondo (cm)</label>
      <input
        id="item-depth"
        data-testid="item-depth-input"
        type="number"
        min="1"
        inputmode="numeric"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
        [value]="depthCm()"
        (input)="onInput('depthCm')($event)"
      />
    </div>

    <div>
      <label class="block text-xs text-slate-600" for="item-weight">Peso (kg)</label>
      <input
        id="item-weight"
        data-testid="item-weight-input"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
        [value]="weightKg()"
        (input)="onInput('weightKg')($event)"
      />
    </div>
  </fieldset>

  <div class="flex items-center gap-3">
    <button type="submit" [class]="primaryClasses" data-testid="item-submit" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Guardar artículo' }}
    </button>

    <span class="text-xs text-slate-500">La foto se guarda solo para este evento.</span>
  </div>

  @if (error(); as message) {
    <p class="text-sm text-red-600" data-testid="item-error">{{ message }}</p>
  }
</form>

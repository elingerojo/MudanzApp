@if (source(); as src) {
  <img
    [src]="src"
    alt=""
    class="h-16 w-16 shrink-0 rounded object-cover"
    data-testid="item-photo"
  />
} @else {
  <span
    class="flex h-16 w-16 shrink-0 items-center justify-center rounded bg-slate-100 text-xs text-slate-500"
    data-testid="item-photo-missing"
    aria-hidden="true"
  >
    …
  </span>
}

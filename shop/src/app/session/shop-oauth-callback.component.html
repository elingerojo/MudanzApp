<section class="rounded-lg border border-slate-300 p-4">
  <h2 class="mb-2 text-lg font-medium">Acceso a la tienda</h2>

  @if (failed()) {
    <p class="text-sm text-red-600" data-testid="shop-oauth-error">{{ error() }}</p>
    <a
      routerLink="/cuenta"
      class="mt-3 inline-block text-sm font-medium underline"
      data-testid="shop-oauth-back"
      >Volver a la cuenta</a
    >
  } @else {
    <p class="text-sm" data-testid="shop-oauth-callback">Completando el acceso…</p>
  }
</section>
